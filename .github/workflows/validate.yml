name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Anthropic's own manifest check. The identifier checks that a mirror-side
      # script used to run live in the monorepo (scripts/check-identifier-parity
      # .test.mjs): the plugin directory accepts no script file from an
      # organization that is not Verified (LOCAL_CODE_FILE_TYPE).
      - name: Claude Code plugin validate
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
